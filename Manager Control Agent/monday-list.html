<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Task Engine</title>
<link rel="stylesheet" href="app/future.css"></head>
<body data-chart-theme="dark">
<div class="bgfx"><div class="g1"></div><div class="g2"></div><div class="dots"></div><div class="scan"></div></div>
<div class="page">
<div class="topbar"><span class="kick mono">// sales_manager_agent<b>.weekly</b> --brief=sue_2026-11-02</span><span class="status grey" id="snap"></span>
 <span style="margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap"><div class="pills" id="roles"><button data-r="sue" class="on">Sue</button><button data-r="lead">Team Lead</button><button data-r="john">John</button><button data-r="bdm">BDM</button></div><select id="rep"></select></span></div>
<main>
 <div class="pills" id="tabs" style="display:inline-flex;margin-bottom:16px"><button data-t="monday" class="on">Monday list</button><button data-t="wednesday">Wednesday nudge</button><button data-t="friday">Friday report</button><button data-t="rollup">Team roll-up</button><button data-t="rules">The rules</button></div>
 <div id="app"></div>
</main></div>
<script src="data/live.js"></script><script src="data/sample.js"></script><script src="data/initiatives.js"></script><script src="app/common.js"></script><script src="app/charts.js"></script><script src="app/engine.js"></script>
<script>
(function(){
const M=window.MCA,E=window.ENG,CH=window.CH,app=document.getElementById('app'); if(!M){app.textContent='No data file found.';return;}
const {D,esc,fmtD,chf,pl,pct,sum}=M;
document.getElementById('snap').textContent=(D.isSample?'SAMPLE DATA':'HUBSPOT SNAPSHOT '+D.generated.slice(0,10))+' · READ ONLY';
const sel=document.getElementById('rep'); const bdms=D.reps.filter(r=>r.team==='BDM'); sel.innerHTML=bdms.map(r=>'<option value="'+r.id+'">'+esc(r.name)+'</option>').join('');
let role='sue', tab='monday', repId=bdms[0].id;
const state=JSON.parse(localStorage.getItem('mca.tasks')||'{}'); const save=()=>localStorage.setItem('mca.tasks',JSON.stringify(state));
const R=()=>bdms.map(E.rollup);
const scope=()=>{ if(role==='lead'){ const me=M.repById[repId]; return R().filter(x=>x.s.r.region===me.region); } if(role==='john') return R().filter(x=>x.johnN>0); return R(); };
const first=n=>n.split(' ')[0]; const wsTag=id=>'<span class="tag" style="color:'+E.wsById[id].color+'">'+esc(E.wsById[id].name)+'</span>';
const tstate=(rep,t)=>state[rep+':'+t.rank+':'+t.ws]||{};
// ---- Monday ----
function monday(){
  if(role==='bdm'){ const r=M.repById[repId], s=M.repSummary(r), tk=E.buildTasks(s); const done=tk.list.filter(t=>tstate(r.id,t).st==='done').length;
    let h='<h1>'+esc(first(r.name))+', your <span class="g">week</span></h1><p class="sub">'+M.W.label+' · Team Lead: <span>'+esc(E.lead(r))+'</span> · '+tk.list.length+' tasks, ranked · built Monday 06:00 from HubSpot and the rules'+(tk.held?' · '+tk.held+' held for next week':'')+'</p>';
    h+='<div class="tiles"><div class="tile"><div class="l">Sue\'s tasks this week</div><div class="v glow">'+tk.list.length+'</div><div class="s">'+(tk.manualCount?tk.manualCount+' added by hand · ':'')+(tk.list.length-tk.manualCount)+' from her rules · '+done+' confirmed</div></div><div class="tile"><div class="l">Inbound on cadence</div><div class="v">'+(s.inbound.length?'<span class="r">'+s.inbound.length+' overdue</span>':'<span class="ok">clear</span>')+'</div></div><div class="tile"><div class="l">Pipeline to fix</div><div class="v">'+(s.past.n+s.stale.n)+'</div><div class="s">'+s.past.n+' past date · '+s.stale.n+' stale</div></div><div class="tile"><div class="l">Prospects worked</div><div class="v">'+s.prospectsWorked+' / '+(s.prospects.length||2)+'</div></div><div class="tile"><div class="l">Priority accounts</div><div class="v">'+s.paWorked+' / '+s.pa.length+'</div><div class="s">worked this week</div></div></div>';
    h+='<div class="grid g21"><div>'+tk.list.map(t=>{const st=tstate(r.id,t); return '<div class="task '+(st.st||'')+'" style="--c:'+E.wsById[t.ws].color+'"><div class="rank">'+t.rank+'<span>'+(t.prio<=2?'NOW':'')+'</span></div><div>'+wsTag(t.ws)+' <span class="chip '+(t.setBy==='Rule'?'na':'vi')+'">set by '+esc(t.setBy==='Rule'?'Sue\'s rules':t.setBy)+'</span><div class="acc">'+esc(t.account)+'</div><div class="act">'+esc(t.action)+'</div><div class="meta"><span>Contact <b>'+esc(t.contact)+'</b></span><span>Due <b>'+esc(t.due)+'</b></span><span>Done when <b>'+esc(t.doneWhen)+'</b></span></div><div class="small" style="margin-top:4px;color:var(--mut2)"><span class="mono" style="color:var(--gr)">evidence</span> the agent checks in HubSpot: '+esc(t.evidence||'')+'</div>'+(st.st==='blocked'?'<div class="small r" style="margin-top:4px">Blocked: '+esc(st.why||'')+'</div>':'')+'</div><div class="acts">'+(st.st?'<button class="btn ghost" data-undo="'+t.rank+':'+t.ws+'">undo</button>':'<button class="btn gr" data-done="'+t.rank+':'+t.ws+'">Done</button><button class="btn rd" data-block="'+t.rank+':'+t.ws+'">Blocked</button>')+'</div></div>';}).join('')+'<p class="small muted">These are Sue\'s tasks, not HubSpot tasks. In the pilot "Done" is confirmed by the evidence line, read from HubSpot on Friday. The buttons are for the demo and save in this browser.</p></div>';
    h+='<div><div class="card vi"><h3>Tasks by workstream</h3>'+CH.hbar(E.WS.map(w=>({label:w.name,value:tk.list.filter(t=>t.ws===w.id).length,color:w.color})).filter(x=>x.value),{labelW:170,barH:14,gap:6})+'</div>';
    h+='<div class="term" style="margin-top:12px"><div class="bar mono"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i><span class="t">announcements.log</span></div><div class="body mono"><span class="p">[new]</span> Media Hub included free on first events until 31 Dec · <span class="m">needs your acknowledgement</span>\n<span class="c">[info]</span> Sales Agent 1.4.4 is in the Claude library\n<span class="m">[archive] 2 older posts</span></div></div>';
    h+='<div class="card gr" style="margin-top:12px"><h3>Reply to the agent</h3><textarea placeholder="e.g. Oracle: spoke to Dana, demo booked Thu 20 Nov. Mark task 3 done."></textarea><div style="margin-top:6px;display:flex;gap:8px;align-items:center"><button class="btn">Send</button><span class="small muted">The agent proposes the HubSpot update and waits for your yes.</span></div></div></div></div>';
    return h;
  }
  const rows=scope(); const me=role==='lead'?M.repById[repId]:null;
  let h='<h1>Monday <span class="g">lists</span>'+(me?' · '+esc(me.region):'')+'</h1><p class="sub">'+M.W.label+' · one list per BDM, 8 to 15 tasks, ranked. '+(role==='john'?'Showing BDMs with John Top 25 accounts.':role==='lead'?'Your team.':'All BDMs.')+' Click a name to open their list.</p>';
  h+='<div class="tiles"><div class="tile"><div class="l">BDMs</div><div class="v glow">'+rows.length+'</div></div><div class="tile"><div class="l">Tasks set</div><div class="v">'+sum(rows.map(x=>x.tasksSet))+'</div><div class="s">'+sum(rows.map(x=>x.tasks.held))+' held for next week</div></div><div class="tile"><div class="l">Inbound overdue</div><div class="v r">'+sum(rows.map(x=>x.s.inbound.length))+'</div></div><div class="tile"><div class="l">Deals past close date</div><div class="v r">'+sum(rows.map(x=>x.s.past.n))+'</div></div><div class="tile"><div class="l">Prospects not worked</div><div class="v">'+sum(rows.map(x=>Math.max(0,(x.prospectsN?Math.min(2,x.prospectsN):2)-x.prospectsWorked)))+'</div></div></div>';
  h+='<div class="card"><h3>Tasks per BDM by workstream</h3><div class="rows">'+rows.map(x=>'<div style="display:grid;grid-template-columns:150px 1fr 60px;gap:10px;align-items:center;padding:5px 0;font-size:12.5px"><b class="click" data-rep="'+x.s.r.id+'" style="cursor:pointer">'+esc(x.s.r.name)+'</b>'+CH.segbar(E.WS.map(w=>({label:w.name,value:x.tasks.list.filter(t=>t.ws===w.id).length,color:w.color})),{legend:false,height:10})+'<span class="muted" style="text-align:right">'+x.tasksSet+'</span></div>').join('')+'</div>'+CH.legend(E.WS.map(w=>({label:w.name,color:w.color})))+'</div>';
  if(role!=='bdm'){ const who=role==='sue'?'Sue':role==='john'?'John':esc(M.repById[repId].name);
    h+='<div class="card mg" style="margin-top:12px"><h3>Add a task as '+who+' <span class="n">'+(role==='sue'?'any BDM':role==='john'?'top 25 accounts only':'your team, from 1:1s')+'</span></h3><div class="grid g4" style="margin:0"><select id="at-rep">'+rows.map(x=>'<option value="'+x.s.r.id+'">'+esc(x.s.r.name)+'</option>').join('')+'</select><input type="text" id="at-acc" placeholder="Account"><input type="text" id="at-con" placeholder="Contact"><input type="text" id="at-due" placeholder="Due (e.g. Wed 11 Nov)"></div><div class="grid g3" style="margin:8px 0 0"><input type="text" id="at-act" placeholder="Action, one sentence"><input type="text" id="at-done" placeholder="Done when…"><input type="text" id="at-ev" placeholder="Evidence the agent checks in HubSpot"></div><div style="margin-top:8px;display:flex;gap:8px;align-items:center"><select id="at-ws">'+E.WS.map(w=>'<option value="'+w.id+'">'+esc(w.name)+'</option>').join('')+'</select><button class="btn" id="at-add">Add to their Monday list</button><span class="small muted">If a task cannot be written this specifically, it is not sent.</span></div>';
    const mine=E.manual().filter(m=>rows.some(x=>x.s.r.id===m.rep)); if(mine.length) h+='<div class="sec" style="margin-top:12px">Tasks added by hand</div><table><thead><tr><th>BDM</th><th>Account</th><th>Action</th><th>Due</th><th>Set by</th><th></th></tr></thead><tbody>'+mine.map(m=>'<tr><td>'+esc((M.repById[m.rep]||{}).name||'')+'</td><td><b>'+esc(m.account)+'</b></td><td class="small">'+esc(m.action)+'</td><td class="small">'+esc(m.due)+'</td><td><span class="chip vi">'+esc(m.setBy)+'</span></td><td><button class="btn ghost" data-rm="'+m.id+'">remove</button></td></tr>').join('')+'</tbody></table>';
    h+='</div>'; }
  return h;
}
// ---- Wednesday ----
function wednesday(){
  const rows=role==='bdm'?[E.rollup(M.repById[repId])]:scope();
  let h='<h1>Wednesday <span class="g">nudge</span></h1><p class="sub">A short message, tasks still open, nothing else. Sent 09:00 local time.</p><div class="grid g2">';
  rows.forEach(x=>{ const open=x.tasks.list.filter(t=>!tstate(x.s.r.id,t).st); h+='<div class="term"><div class="bar mono"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i><span class="t">nudge → '+esc(first(x.s.r.name))+'</span></div><div class="body">Hi '+esc(first(x.s.r.name))+', '+open.length+' of '+x.tasks.list.length+' still open:\n'+open.slice(0,6).map(t=>'<span class="'+(t.prio<=2?'r':'c')+'">•</span> '+esc(t.account)+' <span class="m">· '+esc(t.due)+'</span>').join('\n')+(open.length>6?'\n<span class="m">… and '+(open.length-6)+' more</span>':'')+'\n\n<span class="m">Reply "done 3" or "blocked 5: on holiday" and I update the list.</span></div></div>'; });
  return h+'</div>';
}
// ---- Friday ----
function friday(){
  const rows=role==='bdm'?[E.rollup(M.repById[repId])]:scope();
  let h='<h1>Friday <span class="g">report</span></h1><p class="sub">One per BDM, shared with the BDM, their Team Lead and Sue. Opens with what has not been done. <button class="btn ghost noprint" onclick="window.print()">Print</button></p>';
  rows.forEach(x=>{ const s=x.s, tk=x.tasks, f=x.f; const missed=tk.list.filter(t=>!tstate(s.r.id,t).st||tstate(s.r.id,t).st==='blocked');
    const sec=(t,body,cls)=>'<div class="card '+(cls||'')+'"><h3>'+t+'</h3>'+body+'</div>';
    const li=a=>a.length?'<ul class="list">'+a.map(z=>'<li>'+z+'</li>').join('')+'</ul>':'<div class="small muted">Nothing to report.</div>';
    const need=t=>'<div class="need">Needs: '+t+'</div>';
    h+='<div class="sec">'+esc(s.r.name)+' · '+esc(s.r.team)+' · Team Lead '+esc(x.lead)+' · '+M.W.label+'</div><div class="grid g3">';
    h+=sec('1 · Announcements','<ul class="list"><li><span class="t">Media Hub included free on first events</span><span class="chip warn">not acknowledged</span></li></ul>'+need('announcement board'),'mg');
    h+=sec('2 · Not done this week <span class="n">'+missed.length+' of '+tk.list.length+'</span>',li(missed.slice(0,8).map(t=>'<span class="t">'+wsTag(t.ws)+' '+esc(t.account)+'<div class="small muted">'+esc(t.action)+'</div></span><span class="mm">'+(tstate(s.r.id,t).st==='blocked'?'blocked: '+esc(tstate(s.r.id,t).why||''):'open')+'</span>')),'rd');
    h+=sec('3 · Meetings <span class="n">'+s.ms.length+' this week · '+(s.ms.length+s.lm.length)+' this fortnight</span>',CH.hbar(Object.entries(s.ms.concat(s.lm).reduce((c,m)=>{const k=m.type||'No type';c[k]=(c[k]||0)+1;return c;},{})).sort((a,b)=>b[1]-a[1]).map(([k,v])=>({label:k,value:v,color:k==='No type'?CH.C.crit:CH.C.s1})),{labelW:120,barH:12,gap:5})+(s.g.noType.length?'<div class="small r" style="margin-top:6px">No type: '+s.g.noType.slice(0,4).map(m=>esc(m.company||m.title)).join(', ')+(s.g.noType.length>4?'…':'')+'</div>':'')+'<div class="small muted">By source (inbound, expansion, new logo, repeat): needs meetings linked to deals.</div>');
    h+=sec('4 · Forecast <span class="n">'+f.month+'</span>','<div class="hero" style="font-size:28px">'+chf(f.forecast)+'</div><div class="small muted">forecast = won '+chf(f.won)+' + commit '+chf(f.commit)+' + ½ best case '+chf(f.best)+' + weighted pipeline '+chf(f.weighted)+'</div>'+CH.segbar([{label:'won',value:Math.round(f.won),color:CH.C.good},{label:'commit',value:Math.round(f.commit),color:CH.C.s1},{label:'best case',value:Math.round(f.best),color:CH.C.s3},{label:'pipeline',value:Math.round(f.pipeline),color:'#5d6f8a'}],{height:10})+need('forecast category on '+f.noCategory+' deals closing this month; stage used as a stand-in. Monday snapshots for change since last week.'),'vi');
    h+=sec('5 · Strategic prospects',s.prospects.length?li(s.prospects.map(a=>'<span class="t"><b>'+esc(a.name)+'</b><div class="small muted">last activity '+(a.lastActivity?fmtD(a.lastActivity):'never')+'</div></span>'+(a.workedThisWeek?'<span class="chip ok">worked</span>':'<span class="chip bad">not worked</span>'))):'<div class="chip bad">none named</div>','cy');
    h+=sec('6 · Top 20 priority accounts <span class="n">'+s.paWorked+' with activity · '+s.paNeeds+' none in 30 days</span>',li(s.pa.filter(a=>a.status==='needswork').slice(0,5).map(a=>'<span class="t">'+esc(a.name)+'</span><span class="mm">'+(a.lastActivity?fmtD(a.lastActivity):'never')+'</span>'))+'<div class="small muted">Account plans out of date: needs plan location.</div>');
    h+=sec('7 · Top 25 with John <span class="n">'+s.johnWorked+' of '+s.john.length+' worked</span>',li(s.john.slice(0,5).map(a=>'<span class="t">'+esc(a.name)+'</span>'+(a.workedThisWeek?'<span class="chip ok">active</span>':'<span class="chip na">quiet</span>'))));
    h+=sec('8 · Large accounts not come back <span class="n">'+tk.lapsed.length+'</span>',li(tk.lapsed.map(a=>'<span class="t"><b>'+esc(a.name)+'</b><div class="small muted">'+chf(a.revenue)+' lifetime · '+(a.lastActivity?'last activity '+fmtD(a.lastActivity):'never touched')+'</div></span><span class="chip bad">no reason recorded</span>'))+need('Reason not returned field; last won deal date'));
    h+=sec('9 · Pipeline health <span class="n">'+s.past.n+' past date · '+s.stale.n+' no contact 14d+ · '+s.noNext.length+' no next step</span>',li(s.pastList.slice(0,4).map(d=>'<span class="t">'+esc(d.name)+'</span><span class="mm">'+chf(d.amount)+' · was due '+fmtD(d.close)+'</span>')),'rd');
    h+=sec('10 · Won, lost, disqualified <span class="n">since '+fmtD(D.lostSince||'2026-10-05')+'</span>','<div class="tiles" style="margin:0 0 8px"><div class="tile"><div class="l">Won</div><div class="v ok">'+s.won.length+'</div><div class="s">'+chf(s.wonAmt)+'</div></div><div class="tile"><div class="l">Lost</div><div class="v r">'+s.lost.length+'</div><div class="s">'+chf(sum(s.lost.map(d=>d.amount)))+'</div></div><div class="tile"><div class="l">Win rate</div><div class="v">'+x.winRate+'%</div></div></div>'+(x.topReasons.length?'<div class="small">Top reasons: '+x.topReasons.map(([k,v])=>esc(k)+' ('+v+')').join(', ')+'</div>':'')+'<div class="small muted">Disqualified and uncontactable: to add from the closed stages.</div>');
    h+=sec('11 · Overdue invoices',need('finance export or integration (HubSpot holds 2 invoices)'),'am');
    h+=sec('12 · Department initiatives','<ul class="list"><li><span class="t"><b>Media Hub included free</b><div class="small muted">qualifying: '+s.dueList.filter(d=>/new/i.test(d.growth||'')).length+' new logo deals due by 31 Dec</div></span><span class="chip na">offered: not recorded</span></li></ul>'+need('deal fields Initiative offered / response'),'mg');
    h+=sec('13 · Demos <span class="n">'+s.g.demos.length+' this fortnight</span>',li(s.g.demos.slice(0,4).map(m=>'<span class="t">'+esc(m.company||m.title)+'</span><span class="chip warn">feedback missing</span>'))+need('demo feedback note template'));
    h+=sec('14 · Inbound <span class="n">'+s.inbound.length+' off cadence</span>',li(s.inbound.slice(0,4).map(t=>'<span class="t">'+esc(t.subject.replace(/^New Lead in: /,''))+'</span><span class="mm">due '+fmtD(t.due)+'</span>')));
    h+=sec('15 · Large deals (CHF 20k+) <span class="n">'+x.largeNoSponsor+' without a named sponsor</span>',li(s.dueList.filter(d=>(d.amount||0)>=E.LARGE).slice(0,4).map(d=>'<span class="t">'+esc(d.name)+'</span><span class="mm">'+chf(d.amount)+'</span>'))+need('sponsor field on the deal'),'am');
    h+=sec('16 · Done well',li([...(tk.list.filter(t=>tstate(s.r.id,t).st==='done').length?[tk.list.filter(t=>tstate(s.r.id,t).st==='done').length+' of Sue\'s tasks confirmed done']:[]),...(s.ms.filter(m=>m.outcome==='COMPLETED').length?[pl(s.ms.filter(m=>m.outcome==='COMPLETED').length,'meeting')+' held']:[]),...s.wonWk.map(d=>'Won: '+esc(d.name)+(d.amount?' ('+chf(d.amount)+')':'')),...(s.calls.thisWeek||s.emails.thisWeek?[s.calls.thisWeek+' calls, '+s.emails.thisWeek+' emails logged']:[])].map(z=>'<span class="t">'+z+'</span>')),'gr');
    h+='</div><div class="card" style="margin-bottom:18px"><h3>Next week <span class="n">draft list, so you see it before Monday</span></h3><div class="small muted">Carried forward: '+missed.length+' · Repeat misses escalate to '+(x.lead==='Sue'?'Sue':esc(x.lead)+' and Sue')+'.</div></div>';
  });
  return h;
}
// ---- Roll-up ----
function rollup(){
  const rows=scope().sort((a,b)=>b.gaps-a.gaps); const me=role==='lead'?M.repById[repId]:null;
  let h='<h1>Team <span class="g">roll-up</span>'+(me?' · '+esc(me.region):'')+'</h1><p class="sub">Friday, to Sue'+(me?' and '+esc(me.name):'')+'. Sorted with the largest gaps at the top. Columns as in the brief; grey ones need a HubSpot field or the finance export.</p>';
  h+='<div class="card" style="overflow:auto"><table><thead><tr><th>BDM</th><th>Team Lead</th><th class="num">Meetings wk / 2wk</th><th class="num">New business mtgs</th><th class="num">No type</th><th class="num">Forecast this month</th><th class="num">Won vs forecast</th><th class="num">Sue\'s tasks set / confirmed / open</th><th class="num">Prospects</th><th class="num">Priority accts active</th><th class="num">Top 25 done</th><th class="num">Lapsed large</th><th class="num">Pipeline out of date</th><th class="num">Won / lost (90d)</th><th>Top lost reasons</th><th class="num muted">Overdue invoices</th><th class="num muted">Initiatives</th><th class="num muted">Announcements unread</th><th class="num">Demos no feedback</th><th class="num muted">Repeat misses</th><th class="num">Gaps</th></tr></thead><tbody>';
  rows.forEach(x=>{ h+='<tr class="click" data-rep="'+x.s.r.id+'"><td><b>'+esc(x.s.r.name)+'</b></td><td class="small">'+esc(x.lead)+'</td><td class="num">'+x.meetingsWeek+' / '+x.meetingsFortnight+'</td><td class="num">'+x.newBiz+'</td><td class="num">'+(x.noType?'<span class="r">'+x.noType+'</span>':'0')+'</td><td class="num">'+chf(x.f.forecast)+'</td><td class="num">'+chf(x.f.won)+' · '+pct(x.f.won,x.f.forecast||1)+'%</td><td class="num">'+x.tasksSet+' / '+x.tasksDone+' / '+(x.tasksOpen?'<span class="r">'+x.tasksOpen+'</span>':'0')+'</td><td class="num">'+(x.prospectsN?x.prospectsWorked+' of 2':'<span class="r">none</span>')+'</td><td class="num">'+x.paActive+' of '+x.paN+'</td><td class="num">'+x.johnDone+' of '+x.johnN+'</td><td class="num">'+x.lapsedN+' · '+chf(x.lapsedValue)+'</td><td class="num">'+(x.outOfDate?'<span class="r">'+x.outOfDate+'</span>':'0')+' · '+chf(x.outOfDateValue)+'</td><td class="num">'+x.won+' / '+x.lost+' · '+x.winRate+'%</td><td class="small">'+x.topReasons.map(([k,v])=>esc(k.slice(0,22))+' ('+v+')').join('<br>')+'</td><td class="num muted">n/a</td><td class="num muted">n/a</td><td class="num muted">n/a</td><td class="num">'+x.demosNoFeedback+'</td><td class="num muted">n/a</td><td class="num"><b class="'+(x.gaps>=5?'r':x.gaps>=3?'':'ok')+'">'+x.gaps+'</b></td></tr>'; });
  h+='</tbody></table></div>';
  h+='<div class="grid g3" style="margin-top:12px"><div class="card"><h3>Gaps by BDM</h3>'+CH.hbar(rows.map(x=>({label:x.s.r.name,value:x.gaps,color:x.gaps>=5?CH.C.crit:x.gaps>=3?CH.C.warn:CH.C.good})),{labelW:140,barH:14,gap:6})+'</div><div class="card vi"><h3>Forecast this month by BDM</h3>'+CH.hbar(rows.slice().sort((a,b)=>b.f.forecast-a.f.forecast).map(x=>({label:x.s.r.name,value:Math.round(x.f.forecast),color:CH.C.s1})),{fmt:CH.fmtCHF,labelW:140,barH:14,gap:6})+'</div><div class="card rd"><h3>Why we lose <span class="n">team, since '+fmtD(D.lostSince||'2026-10-05')+'</span></h3>'+CH.hbar(E.teamReasons().slice(0,7).map(([k,v])=>({label:k.length>24?k.slice(0,23)+'…':k,value:v,color:k==='(no reason)'?CH.C.crit:CH.C.s2,tip:k+': '+v})),{labelW:160,barH:14,gap:6})+'</div></div>';
  return h;
}
function rules(){ return '<h1>The <span class="g">rules</span></h1><p class="sub">Nine workstreams per BDM from the brief. Each has a weekly rule and what counts as done. The agent only works if activity is logged on the day.</p><div class="card"><table><thead><tr><th>Workstream</th><th>Weekly rule</th><th>Counts as done</th><th>Evidence the agent reads in HubSpot</th></tr></thead><tbody>'+E.WS.map(w=>'<tr><td><span class="tag" style="color:'+w.color+'">'+esc(w.name)+'</span></td><td>'+esc(w.rule)+'</td><td>'+esc(w.done)+'</td><td class="small muted">'+esc(E.EVID[w.id])+'<div style="margin-top:3px">Fields: '+({inbound:'Tasks "New Lead in", due dates',pipeline:'Deals: close date, next activity, last contact',prospects:'Companies: Strategic Relationships = Strategic Prospects',large:'Deals: amount ≥ CHF 20k; sponsor field (new)',top20:'Companies: Priority account (new) or Target Account',top25:'Companies: John Top 25, Global Main Account (parent)',lapsed:'Won deals by company: value, last won date; Reason not returned (new)',demo:'Meetings of demo type; feedback note template (new)',hygiene:'Meetings: Call and meeting type, outcome',protected:'Calendar slot plus calls logged in it'}[w.id])+'</div></td></tr>').join('')+'</tbody></table></div><div class="card gr" style="margin-top:12px"><h3>Sue\'s tasks are not HubSpot tasks</h3><p class="small">The list is Sue\'s: set by her, John, a Team Lead, or generated from her rules. It lives in the agent. HubSpot is only the evidence: on Friday the agent reads HubSpot and confirms each task from the evidence line, so nobody ticks a box. HubSpot\'s own task list is separate and is not shown here.</p></div><div class="card gr" style="margin-top:12px"><h3>Task format</h3><p class="small">Every task names one account, one person to contact, one action, one due date and what done looks like. Set by the agent, Sue, John or a Team Lead. Monday: list built. Wednesday: nudge. Friday: closed, carried forward or missed. Missed carries forward once; a second miss is escalated.</p></div>'; }
const views={monday,wednesday,friday,rollup,rules};
function render(){ document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab)); app.innerHTML=views[tab](); app.querySelectorAll('svg').forEach(CH.hover);
  app.querySelectorAll('[data-rep]').forEach(el=>el.addEventListener('click',()=>{repId=el.dataset.rep;role='bdm';setRole();sel.value=repId;tab=tab==='rollup'?'friday':'monday';render();}));
  app.querySelectorAll('[data-done]').forEach(b=>b.onclick=()=>{state[repId+':'+b.dataset.done]={st:'done'};save();render();});
  app.querySelectorAll('[data-block]').forEach(b=>b.onclick=()=>{const why=prompt('Why is it blocked?')||'';state[repId+':'+b.dataset.block]={st:'blocked',why};save();render();});
  app.querySelectorAll('[data-undo]').forEach(b=>b.onclick=()=>{delete state[repId+':'+b.dataset.undo];save();render();});
  app.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{E.removeManual(b.dataset.rm);render();});
  const add=app.querySelector('#at-add'); if(add) add.onclick=()=>{const g=id=>(app.querySelector('#'+id)||{}).value||''; if(!g('at-acc')||!g('at-act')||!g('at-due')){alert('Account, action and due date are needed.');return;} E.addManual({rep:g('at-rep'),account:g('at-acc'),contact:g('at-con')||'Main contact',action:g('at-act'),due:g('at-due'),doneWhen:g('at-done')||'Logged in HubSpot',evidence:g('at-ev'),ws:g('at-ws'),setBy:role==='sue'?'Sue':role==='john'?'John':M.repById[repId].name.split(' ')[0]}); render();};
  window.scrollTo(0,0); }
function setRole(){ document.querySelectorAll('#roles button').forEach(b=>b.classList.toggle('on',b.dataset.r===role)); sel.style.display=(role==='bdm'||role==='lead')?'':'none'; if(role==='lead'){ const leads=Object.values(D.leads||{}); sel.innerHTML=leads.map(id=>'<option value="'+id+'">'+esc(M.repById[id].name)+' · '+esc(M.repById[id].region)+'</option>').join(''); if(!leads.includes(repId)) repId=leads[0]||repId; sel.value=repId; } else { sel.innerHTML=bdms.map(r=>'<option value="'+r.id+'">'+esc(r.name)+'</option>').join(''); if(!bdms.some(r=>r.id===repId)) repId=bdms[0].id; sel.value=repId; } }
document.querySelectorAll('#roles button').forEach(b=>b.onclick=()=>{role=b.dataset.r;setRole();render();});
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render();});
sel.onchange=()=>{repId=sel.value;render();};
setRole(); render();
})();
</script></body></html>
