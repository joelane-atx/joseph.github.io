<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sales Command Center</title>
<style>
:root{--bg:#f6f5f3;--side:#121317;--side2:#22242b;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--line:#e4e2dd;--brand:#F8531C;--brand-soft:#FEF0EA;--good:#0ca30c;--good-soft:#e9f6e9;--warn:#fab219;--warn-soft:#fff4d6;--crit:#d03b3b;--crit-soft:#fbe7e7;--info:#2a78d6;--info-soft:#e6f0fb;--card:#fcfcfb}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;display:grid;grid-template-columns:224px 1fr;min-height:100vh}
aside{background:var(--side);color:#c9cad1;padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:3px}
aside .logo{color:#fff;font-weight:800;font-size:17px;padding:4px 10px 16px;letter-spacing:.2px;line-height:1.2}aside .logo span{color:var(--brand)}
aside a{display:flex;align-items:center;gap:9px;color:#c9cad1;text-decoration:none;padding:8px 10px;border-radius:9px;font-size:13.5px;cursor:pointer}
aside a i{width:8px;height:8px;border-radius:50%;background:#3b3d47;flex:none}aside a.on{background:var(--side2);color:#fff;font-weight:600}aside a.on i{background:var(--brand)}aside a:hover{background:var(--side2)}
aside .sec{font-size:10px;text-transform:uppercase;letter-spacing:.9px;color:#6f717c;padding:14px 10px 4px}aside .foot{margin-top:auto;font-size:11px;color:#6f717c;padding:10px;line-height:1.4}
.top{background:#fff;border-bottom:1px solid var(--line);padding:10px 22px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:5}
.top h1{font-size:16px;margin:0}.role{display:flex;gap:3px;background:#f1efed;padding:3px;border-radius:10px}.role button{font:inherit;font-size:13px;border:0;background:transparent;padding:5px 11px;border-radius:8px;cursor:pointer;color:var(--ink2)}.role button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.14);font-weight:600;color:var(--ink)}
.top select{font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}.badge{font-size:11px;padding:3px 9px;border-radius:999px;background:#efedeb;color:#444;font-weight:600;white-space:nowrap}
main{padding:20px 22px 40px;max-width:1540px}
h2{font-size:22px;margin:0 0 2px;letter-spacing:-.2px}.sub{color:var(--ink2);margin:0 0 16px;font-size:13px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.tile .l{font-size:11px;letter-spacing:.3px;color:var(--muted)}.tile .v{font-size:26px;font-weight:700;margin:3px 0 2px;letter-spacing:-.3px}.tile .s{font-size:12px;color:var(--ink2)}.tile .d{font-size:12px;font-weight:600}.d.up{color:#006300}.d.down{color:var(--crit)}
.hero .v{font-size:46px}
.grid{display:grid;gap:12px;margin-bottom:12px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr 1fr}.g21{grid-template-columns:2fr 1fr}.g12{grid-template-columns:1fr 2fr}@media(max-width:1150px){.g2,.g3,.g21,.g12{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:0 1px 2px rgba(0,0,0,.03);min-width:0}
.card h3{margin:0 0 10px;font-size:14px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}.card h3 .n{color:var(--muted);font-weight:400;font-size:12px}
.chip{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;font-weight:600;white-space:nowrap}.chip.ok{background:var(--good-soft);color:#0a7a0a}.chip.warn{background:var(--warn-soft);color:#8a5a00}.chip.bad{background:var(--crit-soft);color:var(--crit)}.chip.na{background:#efedeb;color:#777}.chip.info{background:var(--info-soft);color:#1c5cab}.chip.brand{background:var(--brand-soft);color:#9a3a12}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}th{font-size:11px;letter-spacing:.3px;color:var(--muted);background:transparent;white-space:nowrap;font-weight:600}td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.click{cursor:pointer}tr.click:hover td{background:#fff6f1}
.list{list-style:none;margin:0;padding:0}.list li{padding:7px 0;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap}.list li:last-child{border-bottom:0}.list .t{flex:1;min-width:160px}.list .m{color:var(--muted);font-size:12px;white-space:nowrap}
.small{font-size:12px}.muted{color:var(--muted)}
.btn{font:inherit;font-size:13px;padding:7px 11px;border-radius:9px;border:1px solid var(--ink);background:var(--ink);color:#fff;cursor:pointer}.btn.light{background:#fff;color:var(--ink)}.btn.ghost{border-color:var(--line);background:#fff;color:var(--ink2)}
.drawer{position:fixed;top:0;right:0;width:min(600px,100%);height:100vh;background:#fff;border-left:1px solid var(--line);box-shadow:-8px 0 28px rgba(0,0,0,.1);padding:20px;overflow:auto;z-index:20;display:none}.drawer.open{display:block}.drawer h3{margin:0 0 4px;font-size:18px}.drawer .x{float:right;cursor:pointer;font-size:22px;color:var(--muted)}
textarea,input[type=text],input[type=number]{font:inherit;padding:7px;border:1px solid var(--line);border-radius:8px;width:100%}
.note{background:var(--info-soft);border-left:3px solid var(--info);padding:8px 10px;border-radius:6px;font-size:12px;margin:8px 0}.comment{background:#fffbe6;border:1px solid #f1e3a0;border-radius:8px;padding:7px 10px;font-size:13px}
.inbox-item{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;background:var(--card)}.inbox-item .h{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.inbox-item .act{margin-top:8px;display:flex;gap:6px}.inbox-item.done{opacity:.5}
.rings{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}.ringc{display:flex;gap:10px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:12px;background:#fff;cursor:pointer}.ringc .t{font-size:12px;font-weight:600;line-height:1.25}.ringc .s{font-size:11px;color:var(--muted)}
.rows .r{display:grid;grid-template-columns:120px 1fr 60px;gap:10px;align-items:center;padding:4px 0;font-size:12px}.rows .r b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rows .r span{text-align:right;color:var(--ink2);font-variant-numeric:tabular-nums}
@media(max-width:900px){body{grid-template-columns:1fr}aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap}aside .foot,aside .sec{display:none}}
@media print{aside,.top{display:none}body{grid-template-columns:1fr}}
</style></head>
<body>
<aside>
 <div class="logo">Sales <span>Command</span><br>Center</div>
 <div class="sec">Run the week</div>
 <a data-v="overview" class="on"><i></i>Overview</a><a data-v="initiatives"><i></i>Initiatives</a><a data-v="scorecards"><i></i>Scorecards and leaderboard</a><a data-v="inbox"><i></i>Agent inbox</a><a data-v="friday"><i></i>Friday report</a>
 <div class="sec">Look deeper</div>
 <a data-v="meetings"><i></i>Meetings intelligence</a><a data-v="pipeline"><i></i>Pipeline and forecast</a><a data-v="coverage"><i></i>Account coverage</a>
 <div class="sec">Run the system</div>
 <a data-v="rollout"><i></i>Tool rollout</a><a data-v="settings"><i></i>Settings and how it works</a>
 <div class="foot">Reads HubSpot only.<br>Every change needs a human yes.</div>
</aside>
<div>
 <div class="top"><h1 id="title">Overview</h1>
  <div class="role"><button data-r="exec">Executive</button><button data-r="manager" class="on">Head of sales</button><button data-r="rep">Rep</button><button data-r="owner">Agent owner</button></div>
  <select id="rep"></select><span class="badge" id="snap"></span></div>
 <main id="app"></main>
</div>
<div class="drawer" id="drawer"></div>
<script src="data/live.js"></script><script src="data/sample.js"></script><script src="data/initiatives.js"></script><script src="app/common.js"></script><script src="app/charts.js"></script>
<script>
(function(){
const M=window.MCA, CH=window.CH, app=document.getElementById('app'); if(!M){app.textContent='No data file found.';return;}
const {D,esc,fmtD,chf,pl,pct,sum,by}=M; const INITS=M.inits, LIVE=INITS.filter(i=>i.status==='live'); const C=CH.C;
document.getElementById('snap').textContent=(D.isSample?'Sample data':'HubSpot snapshot '+D.generated)+' · read only';
const sel=document.getElementById('rep'); sel.innerHTML=D.reps.map(r=>'<option value="'+r.id+'">'+esc(r.name)+'</option>').join('');
let role='manager', view='overview', repId=D.reps[0].id;
const first=n=>n.split(' ')[0];
let _S; const S=()=>_S||(_S=D.reps.map(M.repSummary));
const comments=JSON.parse(localStorage.getItem('mca.comments')||'{}'); const saveComment=(id,v)=>{comments[id]=v;localStorage.setItem('mca.comments',JSON.stringify(comments));};
const ratings=JSON.parse(localStorage.getItem('mca.demos')||'{}'); const inboxState=JSON.parse(localStorage.getItem('mca.inbox')||'{}');
const countStates=arr=>arr.reduce((c,x)=>{c[x.state]=(c[x.state]||0)+1;return c;},{});
const scoreRep=s=>{const sc=LIVE.map(i=>M.score(i,s));const c=countStates(sc);return {sc,c,points:(c.ok||0)*2+(c.warn||0),max:2*sc.filter(x=>x.state!=='na').length};};
const chipS=st=>'<span class="chip '+st+'">'+({ok:'on track',warn:'partly',bad:'behind',na:'n/a'}[st])+'</span>';
const statusChip=i=>'<span class="chip '+(i.status==='live'?'ok':i.status==='needs field'?'warn':i.status==='prototype'?'info':'na')+'">'+esc(i.status)+'</span>';
const stateSeg=c=>CH.segbar([{label:'on track',value:c.ok||0,color:C.good},{label:'partly',value:c.warn||0,color:C.warn},{label:'behind',value:c.bad||0,color:C.crit},{label:'n/a',value:c.na||0,color:'#e6e4df'}],{legend:false});
const tile=(l,v,s,d)=>'<div class="tile"><div class="l">'+l+'</div><div class="v">'+v+'</div>'+(d?'<div class="d '+(d.up?'up':'down')+'">'+d.text+'</div>':'')+'<div class="s">'+(s||'')+'</div></div>';
const delta=(a,b,w)=>{if(a===b) return {up:true,text:'= last week'}; const up=a>b; return {up:w? up: !up, text:(up?'▲ ':'▼ ')+Math.abs(a-b)+' vs last week'};};
const since=fmtD(D.lostSince||'2026-10-05');
const heatRows=(all)=>all.map(s=>({label:s.r.name,attr:' data-rep="'+s.r.id+'"',cells:LIVE.map(i=>{const x=M.score(i,s);return {state:x.state,tip:i.name+': '+x.label};})}));
const heatCols=LIVE.map(i=>i.name.replace(/^Every /,'').replace(/ worked every week$/,'').slice(0,28));
const monthKey=d=>d.close.slice(0,7);
function dueByMonth(all){ const m={}; all.flatMap(s=>s.dueList).forEach(d=>{const k=monthKey(d); m[k]=(m[k]||0)+(d.amount||0);}); const keys=Object.keys(m).sort(); return {cats:keys.map(k=>new Date(k+'-01T00:00:00Z').toLocaleDateString('en-GB',{month:'short',year:'2-digit',timeZone:'UTC'})),vals:keys.map(k=>m[k])}; }
function stageMix(all){ const m={}; all.flatMap(s=>s.dueList).forEach(d=>{m[d.stage]=(m[d.stage]||0)+1;}); const order=['Deal Created / MQL','Needs Sales Qualification','Sales Qualified/SQL','Create Quote','Quote Sent','Negotiation']; return order.filter(k=>m[k]).map(k=>({label:k,value:m[k]})); }

// ---------- OVERVIEW ----------
function overview(){ const all=S(); if(role==='exec') return execView(all); if(role==='rep') return repView(); if(role==='owner') return ownerView(all);
  const calls=sum(all.map(s=>s.calls.thisWeek)), callsL=sum(all.map(s=>s.calls.lastWeek)), emails=sum(all.map(s=>s.emails.thisWeek)), emailsL=sum(all.map(s=>s.emails.lastWeek)), ms=sum(all.map(s=>s.ms.length)), msL=sum(all.map(s=>s.lm.length));
  const green=all.filter(s=>(scoreRep(s).c.bad||0)===0).length;
  let h='<h2>Head of sales · '+esc(D.manager||'')+'</h2><p class="sub">'+M.W.label+' · every initiative, every rep, confirmed by HubSpot. Click a rep or an initiative to drill down.</p>';
  h+='<div class="tiles">'+tile('Reps with nothing behind',green+' <span class="small muted">of '+all.length+'</span>','across '+LIVE.length+' live initiatives')+tile('Won since '+since,chf(sum(all.map(s=>s.wonAmt))),sum(all.map(s=>s.won.length))+' deals · '+sum(all.map(s=>s.lost.length))+' lost')+tile('Due by 31 Dec',chf(sum(all.map(s=>s.due.amt))),sum(all.map(s=>s.due.n))+' open deals')+tile('Meetings this week',ms,sum(all.map(s=>s.g.noType.length))+' no type · '+sum(all.map(s=>s.g.noOutcome.length))+' no outcome',delta(ms,msL,true))+tile('Calls this week',calls,'',delta(calls,callsL,true))+tile('Emails this week',emails,'',delta(emails,emailsL,true))+'</div>';
  h+='<div class="grid g21"><div class="card"><h3>Initiative health by rep <span class="n">live initiatives · click a name</span></h3>'+CH.heat(heatRows(all),heatCols,{labelW:150})+'</div>';
  const needs=[]; all.forEach(s=>{ if(s.past.n>20) needs.push({t:esc(first(s.r.name))+': '+pl(s.past.n,'deal')+' past their close date ('+chf(s.past.amt)+')',a:'pipeline'}); if(s.g.noOutcome.length>=5) needs.push({t:esc(first(s.r.name))+': '+pl(s.g.noOutcome.length,'meeting')+' with no outcome',a:'meetings'}); if(s.pa.length===0) needs.push({t:esc(first(s.r.name))+': no priority accounts marked',a:'coverage'}); if(s.lostNoReason.length) needs.push({t:esc(first(s.r.name))+': '+pl(s.lostNoReason.length,'lost deal')+' without a reason',a:'meetings'}); }); (D.rollout||[]).filter(p=>p.blocker).forEach(p=>needs.push({t:esc(first(p.name))+' blocked: '+esc(p.blocker),a:'rollout'}));
  h+='<div class="card"><h3>Needs you <span class="n">'+needs.length+'</span></h3><ul class="list">'+(needs.slice(0,12).map(n=>'<li><span class="t">'+n.t+'</span><a class="small" style="color:var(--info);cursor:pointer" data-go="'+n.a+'">open</a></li>').join('')||'<li class="muted">Nothing urgent.</li>')+'</ul></div></div>';
  h+='<div class="grid g21"><div class="card"><h3>New business activity <span class="n">calls plus emails, this week vs last, per rep</span></h3>'+CH.columns(all.map(s=>first(s.r.name)),[{label:'this week',color:C.s1,values:all.map(s=>s.calls.thisWeek+s.emails.thisWeek)},{label:'last week',color:'#b7d3f6',values:all.map(s=>s.calls.lastWeek+s.emails.lastWeek)}],{width:900,height:230})+'</div>';
  const types={}; all.flatMap(s=>s.ms.concat(s.lm)).forEach(m=>{const k=m.type||'No type';types[k]=(types[k]||0)+1;}); const tp=Object.entries(types).sort((a,b)=>b[1]-a[1]); const cols=[C.s1,C.s2,C.s3,C.s4,'#6250d6','#e87ba4','#9ec5f4','#c3c2b7']; const parts=tp.slice(0,5).map(([k,v],i)=>({label:k,value:v,color:k==='No type'?'#c3c2b7':cols[i]})); const rest=tp.slice(5).reduce((a,x)=>a+x[1],0); if(rest) parts.push({label:'Other',value:rest,color:'#e6e4df'});
  h+='<div class="card"><h3>Meetings by type <span class="n">this week and last</span></h3>'+CH.donut(parts,{center:String(sum(parts.map(p=>p.value))),sub:'meetings'})+'</div>';
  h+='</div><div class="grid g3"><div class="card"><h3>Pipeline hygiene <span class="n">open deals per rep</span></h3><div class="rows">'+all.slice().sort((a,b)=>(b.past.n+b.stale.n)-(a.past.n+a.stale.n)).map(s=>'<div class="r"><b>'+esc(first(s.r.name))+'</b>'+CH.segbar([{label:'due by 31 Dec',value:s.due.n,color:C.s1},{label:'past close date',value:s.past.n,color:C.crit},{label:'stale',value:s.stale.n,color:C.warn}],{legend:false})+'<span>'+(s.due.n+s.past.n+s.stale.n)+'</span></div>').join('')+'</div>'+CH.legend([{label:'due by 31 Dec',color:C.s1},{label:'past close date',color:C.crit},{label:'stale 30+ days',color:C.warn}])+'</div>';
  h+='<div class="card"><h3>Scorecard <span class="n">% of points, 2 per initiative on track</span></h3>'+CH.hbar(all.map(s=>({s,sc:scoreRep(s)})).sort((a,b)=>b.sc.points/(b.sc.max||1)-a.sc.points/(a.sc.max||1)).map(x=>({label:x.s.r.name,value:Math.round(100*x.sc.points/(x.sc.max||1)),color:x.sc.points/(x.sc.max||1)>=0.6?C.good:x.sc.points/(x.sc.max||1)>=0.35?C.warn:C.crit,tip:x.s.r.name+': '+x.sc.points+' of '+x.sc.max+' points'})),{fmt:v=>v+'%',max:100,labelW:140,barH:16,gap:6})+'</div>';
  h+='<div class="card"><h3>Won by rep <span class="n">CHF since '+since+'</span></h3>'+CH.hbar(all.map(s=>({label:s.r.name,value:s.wonAmt})).sort((a,b)=>b.value-a.value),{fmt:CH.fmtCHF,labelW:140,barH:16,gap:6})+'</div></div>';
  return h;
}
function execView(all){
  const won=D.deals.won, nl=won.filter(d=>/new/i.test(d.growth||'')||/new customer/i.test(d.type||'')), nlAmt=sum(nl.map(d=>d.amount)), wAmt=sum(won.map(d=>d.amount)), lostAmt=sum(D.deals.lost.map(d=>d.amount));
  const green=all.filter(s=>(scoreRep(s).c.bad||0)===0).length; const dbm=dueByMonth(all);
  let h='<h2>Executive view</h2><p class="sub">The sales organisation at a glance. Strategy 2027: twice the new business. Every number from HubSpot, '+M.W.label.toLowerCase()+'.</p>';
  h+='<div class="grid g12"><div class="tile hero"><div class="l">Closed won since '+since+'</div><div class="v">'+chf(wAmt)+'</div><div class="s">'+won.length+' deals · '+pct(won.length,won.length+D.deals.lost.length)+'% win rate by count</div><div style="margin-top:10px">'+CH.segbar([{label:'new logos',value:Math.round(nlAmt),color:C.s2},{label:'existing customers',value:Math.round(wAmt-nlAmt),color:C.s1}],{height:12})+'</div></div>';
  h+='<div class="tiles" style="margin:0">'+tile('New business share',pct(nlAmt,wAmt)+'%',chf(nlAmt)+' from new logos · target: double')+tile('Lost since '+since,chf(lostAmt),D.deals.lost.length+' deals')+tile('Due by 31 Dec',chf(sum(all.map(s=>s.due.amt))),sum(all.map(s=>s.due.n))+' deals, live stages')+tile('Forecast trust',pct(all.length-all.filter(s=>s.past.n>5||s.stale.n>3).length,all.length)+'%','reps with a clean pipeline')+tile('Team on track',green+' of '+all.length,'reps with no initiative behind')+tile('Activity this week',sum(all.map(s=>s.calls.thisWeek))+' calls','+ '+sum(all.map(s=>s.emails.thisWeek))+' emails logged')+'</div></div>';
  h+='<div class="grid g3"><div class="card"><h3>Won by rep <span class="n">CHF since '+since+'</span></h3>'+CH.hbar(all.map(s=>({label:s.r.name,value:s.wonAmt})).sort((a,b)=>b.value-a.value).slice(0,12),{fmt:CH.fmtCHF,labelW:140})+'</div>';
  h+='<div class="card"><h3>Pipeline due by month <span class="n">CHF, largest deals in live stages</span></h3>'+CH.columns(dbm.cats.slice(0,8),[{label:'due',color:C.s1,values:dbm.vals.slice(0,8)}],{height:220,labels:true})+'<div class="small muted">A monthly commitment per rep turns this into a trajectory line.</div></div>';
  h+='<div class="card"><h3>Why we lose <span class="n">closed lost since '+since+'</span></h3>'+reasonBars()+'</div></div>';
  h+='<div class="grid g2"><div class="card"><h3>Open pipeline by stage <span class="n">deals due by 31 Dec</span></h3>'+CH.ordinal(stageMix(all),{labelW:170})+'</div>';
  h+='<div class="card"><h3>Initiative health <span class="n">share of reps on track, partly, behind</span></h3><div class="rows">'+LIVE.map(i=>{const c=countStates(all.map(s=>M.score(i,s)));return '<div class="r" style="grid-template-columns:210px 1fr 50px"><b title="'+esc(i.name)+'">'+esc(i.name)+'</b>'+stateSeg(c)+'<span>'+(c.ok||0)+'/'+all.length+'</span></div>';}).join('')+'</div>'+CH.legend([{label:'on track',color:C.good},{label:'partly',color:C.warn},{label:'behind',color:C.crit},{label:'nothing to measure',color:'#e6e4df'}])+'</div></div>';
  return h;
}
function reasonBars(){ const c={}; D.deals.lost.forEach(d=>{const k=d.lostReason||'(no reason)';c[k]=(c[k]||0)+1;}); const comp={}; D.deals.lost.filter(d=>d.competitor).forEach(d=>{comp[d.competitor]=(comp[d.competitor]||0)+1;}); return CH.hbar(Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,7).map(([k,v])=>({label:k.length>26?k.slice(0,25)+'…':k,value:v,color:k==='(no reason)'?C.crit:C.s2,tip:k+': '+v})),{labelW:170,barH:16})+(Object.keys(comp).length?'<div class="small muted" style="margin-top:6px">Competitors named: '+Object.entries(comp).sort((a,b)=>b[1]-a[1]).map(([k,v])=>esc(k)+' ('+v+')').join(', ')+'</div>':''); }
function ownerView(all){

  h+='<div class="card"><h3>By stage <span class="n">deals due by 31 Dec</span></h3>'+CH.ordinal(stageMix(all),{labelW:170})+'</div>';
  h+='</div><div class="card"><h3>Won vs lost by rep <span class="n">deals since '+since+'</span></h3>'+CH.columns(all.map(s=>first(s.r.name)),[{label:'won',color:C.s3,values:all.map(s=>s.won.length)},{label:'lost',color:C.s2,values:all.map(s=>s.lost.length)}],{width:1100,height:220})+'</div>';
  h+='<div class="grid g2"><div class="card"><h3>Due by rep <span class="n">CHF by 31 Dec</span></h3>'+CH.hbar(all.map(s=>({label:s.r.name,value:s.due.amt})).sort((a,b)=>b.value-a.value),{fmt:CH.fmtCHF,labelW:150})+'</div>';
  h+='<div class="card"><h3>Hygiene by rep <span class="n">open deals</span></h3><div class="rows">'+all.slice().sort((a,b)=>(b.past.n+b.stale.n)-(a.past.n+a.stale.n)).map(s=>'<div class="r"><b>'+esc(first(s.r.name))+'</b>'+CH.segbar([{label:'due',value:s.due.n,color:C.s1},{label:'past',value:s.past.n,color:C.crit},{label:'stale',value:s.stale.n,color:C.warn}],{legend:false})+'<span>'+(s.due.n+s.past.n+s.stale.n)+'</span></div>').join('')+'</div>'+CH.legend([{label:'due by 31 Dec',color:C.s1},{label:'past close date',color:C.crit},{label:'stale',color:C.warn}])+'</div></div>';
  h+='<div class="grid g2"><div class="card"><h3>Largest deals due by 31 Dec</h3><ul class="list">'+all.flatMap(s=>s.dueList).sort((a,b)=>(b.amount||0)-(a.amount||0)).slice(0,10).map(d=>'<li><span class="t"><b>'+esc(d.name)+'</b><div class="small muted">'+esc(M.repById[d.owner]?.name||'')+' · '+esc(d.stage)+(d.nextActivity?' · next '+fmtD(d.nextActivity):' · no next task')+'</div></span><span class="m">'+chf(d.amount)+' · '+fmtD(d.close)+'</span></li>').join('')+'</ul></div>';
  h+='<div class="card"><h3>Largest deals past their close date</h3><ul class="list">'+all.flatMap(s=>s.pastList).sort((a,b)=>(b.amount||0)-(a.amount||0)).slice(0,10).map(d=>'<li><span class="t"><b>'+esc(d.name)+'</b><div class="small muted">'+esc(M.repById[d.owner]?.name||'')+' · '+esc(d.stage)+'</div></span><span class="m">'+chf(d.amount)+' · was due '+fmtD(d.close)+'</span></li>').join('')+'</ul></div></div>';
  return h;
}
// ---------- COVERAGE ----------
function coverageView(){ const all=S(); const tot={b:sum(all.map(s=>s.pa.filter(a=>a.status==='buying').length)),i:sum(all.map(s=>s.pa.filter(a=>a.status==='intouch').length)),n:sum(all.map(s=>s.paNeeds))};
  let h='<h2>Account coverage</h2><p class="sub">Priority accounts, strategic prospects and the John Top 25: who is worked, who is not, which have revenue.</p>';
  h+='<div class="grid g3"><div class="card"><h3>All priority accounts</h3>'+CH.donut([{label:'buying',value:tot.b,color:C.good},{label:'in touch',value:tot.i,color:C.s1},{label:'needs work',value:tot.n,color:C.crit}],{center:String(tot.b+tot.i+tot.n),sub:'accounts'})+'</div>';
  h+='<div class="card"><h3>Worked this week <span class="n">of the list</span></h3>'+CH.hbar(all.map(s=>({label:s.r.name,value:s.paWorked,color:C.s3,tip:s.r.name+': '+s.paWorked+' of '+s.pa.length})).sort((a,b)=>b.value-a.value),{labelW:150})+'</div>';
  h+='<div class="card"><h3>Status by rep</h3><div class="rows">'+all.map(s=>'<div class="r"><b>'+esc(first(s.r.name))+'</b>'+CH.segbar([{label:'buying',value:s.pa.filter(a=>a.status==='buying').length,color:C.good},{label:'in touch',value:s.pa.filter(a=>a.status==='intouch').length,color:C.s1},{label:'needs work',value:s.paNeeds,color:C.crit}],{legend:false})+'<span>'+s.pa.length+'/'+M.cap(s.r)+'</span></div>').join('')+'</div>'+CH.legend([{label:'buying',color:C.good},{label:'in touch',color:C.s1},{label:'needs work',color:C.crit}])+'</div></div>';
  h+='<div class="grid g2"><div class="card"><h3>Untouched the longest <span class="n">priority accounts with revenue</span></h3>'+CH.hbar(all.flatMap(s=>s.pa.filter(a=>a.status==='needswork'&&a.revenue).map(a=>({label:a.name.length>24?a.name.slice(0,23)+'…':a.name,value:a.revenue,color:C.s2,tip:a.name+' · '+s.r.name+' · '+chf(a.revenue)+' lifetime · '+(a.lastActivity?'last '+fmtD(a.lastActivity):'never touched')}))).sort((a,b)=>b.value-a.value).slice(0,12),{fmt:CH.fmtCHF,labelW:170})+'</div>';
  h+='<div class="card"><h3>Strategic prospects and John Top 25</h3><table><thead><tr><th>Rep</th><th class="num">Prospects touched</th><th class="num">John Top 25 worked</th><th class="num">Lifetime revenue on list</th></tr></thead><tbody>'+all.map(s=>'<tr class="click" data-rep="'+s.r.id+'"><td><b>'+esc(s.r.name)+'</b></td><td class="num">'+s.prospectsWorked+' / '+s.prospects.length+'</td><td class="num">'+s.johnWorked+' / '+s.john.length+'</td><td class="num">'+chf(sum(s.pa.map(a=>a.revenue)))+'</td></tr>').join('')+'</tbody></table></div></div>';
  return h;
}
// ---------- FRIDAY ----------
function friday(){ const all=S();
  let h='<h2>Friday report · '+M.W.label+'</h2><p class="sub">Done and missed, per rep, from HubSpot. Goes to each rep and to the head of sales. <button class="btn light" onclick="window.print()">Print</button></p>';
  h+='<div class="tiles">'+tile('Tasks done',sum(all.map(s=>s.tc.completed)),sum(all.map(s=>s.tl.missed.length))+' overdue')+tile('Meetings held',sum(all.map(s=>s.ms.filter(m=>m.outcome==='COMPLETED').length)),sum(all.map(s=>s.g.noOutcome.length))+' without an outcome')+tile('Won this week',sum(all.map(s=>s.wonWk.length)),chf(sum(all.flatMap(s=>s.wonWk).map(d=>d.amount))))+tile('Priority accounts worked',sum(all.map(s=>s.paWorked)),sum(all.map(s=>s.paNeeds))+' not touched in 30 days')+'</div><div class="grid g2">';
  all.forEach(s=>{ const sc=scoreRep(s); const done=[],missed=[]; if(s.tc.completed) done.push(pl(s.tc.completed,'task')+' completed'); const mc=s.ms.filter(m=>m.outcome==='COMPLETED').length; if(mc) done.push(pl(mc,'meeting')+' held'); if(s.paWorked) done.push(pl(s.paWorked,'priority account')+' worked'); if(s.prospectsWorked) done.push(s.prospectsWorked+' strategic prospects touched'); if(s.calls.thisWeek||s.emails.thisWeek) done.push(s.calls.thisWeek+' calls, '+s.emails.thisWeek+' emails logged'); s.wonWk.forEach(d=>done.push('Won: '+esc(d.name)+(d.amount?' ('+chf(d.amount)+')':'')));
    if(s.tl.missed.length) missed.push(pl(s.tl.missed.length,'task')+' overdue'); else if(!M.tasks(s.r.id,'thisWeek').length&&s.tc.notStarted) missed.push(s.tc.notStarted+' tasks not started'); if(s.g.noOutcome.length) missed.push(pl(s.g.noOutcome.length,'meeting')+' with no outcome'); if(s.g.noType.length) missed.push(pl(s.g.noType.length,'meeting')+' with no type'); if(s.paNeeds) missed.push(pl(s.paNeeds,'priority account')+' not touched in 30 days'); if(s.prospects.length&&!s.prospectsWorked) missed.push('strategic prospects not touched'); if(s.past.n) missed.push(pl(s.past.n,'deal')+' past their close date ('+chf(s.past.amt)+')'); if(s.stale.n) missed.push(pl(s.stale.n,'stale deal')); if(s.inbound.length) missed.push(pl(s.inbound.length,'inbound lead')+' overdue'); s.lostWk.forEach(d=>missed.push('Lost: '+esc(d.name)+' · '+esc(d.lostReason||'no reason given')));
    h+='<div class="card"><h3 style="align-items:center">'+CH.ring(sc.points,sc.max||1,{r:16,stroke:5,color:sc.points/(sc.max||1)>=0.6?C.good:sc.points/(sc.max||1)>=0.35?C.warn:C.crit,text:String(sc.points)})+esc(s.r.name)+' <span class="n">'+esc(s.r.team)+' · '+sc.points+' of '+sc.max+' points</span>'+(comments[s.r.id]?'<span class="chip info">note from manager</span>':'')+'</h3><div class="grid g2" style="margin:0"><div><div class="small" style="color:#0a7a0a;font-weight:700">DONE</div>'+(done.length?'<ul class="list">'+done.map(x=>'<li>'+x+'</li>').join('')+'</ul>':'<div class="small muted">Nothing logged.</div>')+'</div><div><div class="small" style="color:var(--crit);font-weight:700">MISSED</div>'+(missed.length?'<ul class="list">'+missed.map(x=>'<li>'+x+'</li>').join('')+'</ul>':'<div class="small muted">Nothing missed.</div>')+'</div></div>'+(comments[s.r.id]?'<div class="comment" style="margin-top:8px">'+esc(comments[s.r.id])+'</div>':'')+'</div>'; });
  return h+'</div>';
}
// ---------- ROLLOUT / SETTINGS ----------
function rolloutPanel(){ const R=D.rollout||[]; const ok=v=>/yes|running|connected|set up|approved|pro/i.test(v||''); const done=R.filter(p=>ok(p.claude)&&ok(p.m365)&&ok(p.hubspot)).length; return '<div class="grid g12"><div class="card"><h3>Connected</h3>'+CH.donut([{label:'all three connected',value:done,color:C.good},{label:'still connecting',value:R.length-done,color:C.warn}],{center:done+'/'+R.length,sub:'people'})+'</div><div class="card"><h3>Tool rollout <span class="n">Claude, Microsoft 365, HubSpot</span></h3><table><thead><tr><th>Person</th><th>Claude</th><th>Microsoft 365</th><th>HubSpot</th><th>Blocker</th></tr></thead><tbody>'+R.map(p=>'<tr><td><b>'+esc(p.name)+'</b><div class="small muted">'+esc(p.role||'')+'</div></td>'+[p.claude,p.m365,p.hubspot].map(v=>'<td><span class="chip '+(ok(v)?'ok':v?'warn':'bad')+'">'+esc(v||'not started')+'</span></td>').join('')+'<td class="small">'+esc(p.blocker||'')+'</td></tr>').join('')+'</tbody></table><p class="small muted">Daily nudge: one short ask per person in the pilot chat, posted by the agent owner.</p></div></div>'; }
function rolloutView(){ return '<h2>Tool rollout</h2><p class="sub">The pilot stalls when connectors are not done.</p>'+rolloutPanel(); }
function settingsView(){ const s=M.settings;
  return '<h2>Settings and how it works</h2><p class="sub">Targets per rep per week, the roles, and where this runs.</p><div class="grid g2"><div class="card"><h3>Targets</h3><table><tr><td>Calls per week</td><td><input type="number" id="st-calls" value="'+s.callsTarget+'"></td></tr><tr><td>Emails per week</td><td><input type="number" id="st-emails" value="'+s.emailsTarget+'"></td></tr><tr><td>Strategic prospects per BDM</td><td><input type="number" id="st-prospects" value="'+s.prospectsTarget+'"></td></tr></table><div style="margin-top:8px"><button class="btn" id="st-save">Save</button> <span class="small muted">Saved in this browser.</span></div></div>'+
  '<div class="card"><h3>Roles</h3><table class="small"><tr><td><b>Executive</b></td><td>Org KPIs, new business share, win rate, initiative health.</td></tr><tr><td><b>Head of sales</b></td><td>Every initiative, every rep, needs-you list, scorecard, comments.</td></tr><tr><td><b>Rep</b></td><td>My initiatives, do-first list, manager note, reply to the agent.</td></tr><tr><td><b>Agent owner</b></td><td>Data quality, fields to add, rollout, refresh.</td></tr></table></div></div>'+
  '<div class="card"><h3>How it works</h3><ol class="small"><li><b>Strategy in:</b> the head of sales keeps the initiative list (name, why, measure, source, cadence, target).</li><li><b>Monday:</b> the agent reads HubSpot and builds each rep\'s week: the list, the do-first items, the gaps.</li><li><b>All week:</b> reps work. They reply to the agent in plain words; it proposes the HubSpot change and waits for a yes.</li><li><b>Friday:</b> done and missed, per rep, to the rep and the head of sales. Comments ride along.</li><li><b>Monthly:</b> owner audit, forecast vs commitment, demo feedback trends, the 1:1 card: lost reasons and coaching points, not metrics.</li></ol><p class="small"><b>The one rule:</b> the agent reads, drafts and proposes. Nothing is sent and no HubSpot record changes without a human yes.</p><p class="small"><b>Where it runs:</b> today a local page from the shared folder (no cost). Next: inside the Sales Agent in Claude for replies (no hosting), then a hosted site with company sign-in when the team wants it on the web (hosting and API cost, warn first).</p></div>'; }
// ---------- render / bind ----------
const views={overview,initiatives,scorecards,inbox,friday,meetings:meetingsView,pipeline:pipelineView,coverage:coverageView,rollout:rolloutView,settings:settingsView};
const titles={overview:'Overview',initiatives:'Initiatives',scorecards:'Scorecards and leaderboard',inbox:'Agent inbox',friday:'Friday report',meetings:'Meetings intelligence',pipeline:'Pipeline and forecast',coverage:'Account coverage',rollout:'Tool rollout',settings:'Settings'};
function render(){ document.querySelectorAll('aside a').forEach(a=>a.classList.toggle('on',a.dataset.v===view)); document.getElementById('title').textContent=titles[view]; app.innerHTML=views[view](); bind(app); app.querySelectorAll('svg').forEach(CH.hover); window.scrollTo(0,0); }
function bind(root){
  root.querySelectorAll('[data-init]').forEach(el=>el.addEventListener('click',e=>{ if(e.target.closest('[data-rep]')) return; openInit(el.dataset.init); }));
  root.querySelectorAll('[data-rep]').forEach(el=>el.addEventListener('click',e=>{ if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT') return; repId=el.dataset.rep; sel.value=repId; role='rep'; setRole(); view='overview'; document.getElementById('drawer').classList.remove('open'); render(); }));
  root.querySelectorAll('[data-go]').forEach(el=>el.addEventListener('click',()=>{view=el.dataset.go;render();}));
  root.querySelectorAll('input[data-c]').forEach(i=>i.addEventListener('change',()=>saveComment(i.dataset.c,i.value)));
  root.querySelectorAll('select[data-demo]').forEach(i=>i.addEventListener('change',()=>{ratings[i.dataset.demo]=i.value;localStorage.setItem('mca.demos',JSON.stringify(ratings));}));
  root.querySelectorAll('[data-yes]').forEach(b=>b.addEventListener('click',()=>{inboxState[b.dataset.yes]='yes';localStorage.setItem('mca.inbox',JSON.stringify(inboxState));render();}));
  root.querySelectorAll('[data-skip]').forEach(b=>b.addEventListener('click',()=>{inboxState[b.dataset.skip]='skip';localStorage.setItem('mca.inbox',JSON.stringify(inboxState));render();}));
  const sv=root.querySelector('#st-save'); if(sv) sv.onclick=()=>{M.saveSettings({callsTarget:+root.querySelector('#st-calls').value,emailsTarget:+root.querySelector('#st-emails').value,prospectsTarget:+root.querySelector('#st-prospects').value}); _S=null; render();};
  const send=root.querySelector('#send'); if(send) send.onclick=()=>{const v=root.querySelector('#reply').value.trim(); if(!v) return; root.querySelector('#reply-out').innerHTML='<div class="note"><b>Saved for the demo.</b> The agent would turn this into a HubSpot proposal in the inbox and wait for your yes. You wrote: “'+esc(v)+'”</div>';};
}
function setRole(){ document.querySelectorAll('.role button').forEach(b=>b.classList.toggle('on',b.dataset.r===role)); sel.style.display=role==='rep'?'':'none'; }
document.querySelectorAll('aside a').forEach(a=>a.onclick=()=>{view=a.dataset.v;render();});
document.querySelectorAll('.role button').forEach(b=>b.onclick=()=>{role=b.dataset.r;setRole();view='overview';render();});
sel.onchange=()=>{repId=sel.value;render();};
setRole(); render();
})();
</script></body></html>
