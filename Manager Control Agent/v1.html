<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sales Control V1</title>
<script>(function(){var t;try{t=localStorage.getItem("mca.theme")}catch(e){}document.documentElement.dataset.theme=t||"dark";})();</script>
<link rel="stylesheet" href="app/future.css">
<style>
/* V1: one screen, Sue's three priorities, leaderboard, drill-down drawer */
body{overflow-x:hidden}
.v1{padding:12px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));max-width:1500px;margin:0 auto}
.bar1{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.bar1 h1{font-size:20px;margin:0;letter-spacing:-.01em}.bar1 h1 span{color:var(--cy)}
.bar1 .sp{flex:1}
.bar1 select{font:inherit;font-size:12.5px;background:var(--card2);color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:6px 8px}
.pri{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:10px}
.pri .card{cursor:pointer;padding:10px 14px}.pri .card.on{box-shadow:0 0 0 1px var(--c),0 0 24px -6px var(--c)}
.pri .k{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);display:flex;justify-content:space-between}
.pri .big{font-size:24px;font-weight:800;letter-spacing:-.02em;margin:2px 0 6px}.pri .big small{font-size:12.5px;font-weight:500;color:var(--mut);letter-spacing:0;margin-left:6px}
.pri .ln{font-size:12px;color:var(--mut);margin-top:6px;line-height:1.45}.pri .ln b{color:var(--ink);font-weight:600}
.lg{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--mut);margin-top:4px}.lg i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;vertical-align:0}
.main{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:10px}
@media(max-width:1100px){.main,.pri{grid-template-columns:1fr}}
.lb{overflow:auto}.lb table{width:100%;border-collapse:collapse;font-size:12.5px}
.lb th{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);text-align:left;font-weight:600;padding:4px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
.lb td{padding:2px 6px;line-height:1.35;border-bottom:1px dashed var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
.lb tr.p{cursor:pointer}.lb tr.p:hover td{background:rgba(34,229,255,.06)}
.lb td.n,.lb th.n{text-align:right}.lb .mini{width:90px;display:inline-block;vertical-align:middle}
.lb th.on{color:var(--cy)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}.dot.ok{background:var(--gr)}.dot.warn{background:var(--am)}.dot.bad{background:var(--rd)}
.nud{font-size:12.5px}.nud li{display:block}.nud .who{color:var(--cy);font-weight:700;cursor:pointer}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(760px,100%);background:var(--bg);border-left:1px solid var(--line);box-shadow:-20px 0 60px rgba(0,0,0,.35);z-index:40;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) 16px}
.drawer[hidden]{display:none}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:39}.scrim[hidden]{display:none}
.dh{display:flex;align-items:center;gap:10px;padding:14px 0 8px}.dh h2{margin:0;font-size:18px}.dh .sp{flex:1}
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:8px}
.tabs button{font:inherit;font-size:12.5px;padding:6px 10px;border-radius:7px;border:1px solid var(--line);background:transparent;color:var(--mut);cursor:pointer}
.tabs button.on{border-color:var(--cy);color:var(--cy);background:rgba(34,229,255,.1)}
.db{overflow:auto;padding:10px 0 20px;flex:1}
.db table{width:100%;border-collapse:collapse;font-size:12.5px}.db th{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);text-align:left;padding:4px 6px;border-bottom:1px solid var(--line)}.db td{padding:5px 6px;border-bottom:1px dashed var(--line);vertical-align:top}
.db h4{margin:14px 0 6px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:10px 0}@media(max-width:600px){.three{grid-template-columns:1fr}}
.three .tile .v{font-size:20px}
.ask{width:100%;min-height:90px;font:inherit;font-size:12.5px;background:var(--card2);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px}
.tf{display:grid;grid-template-columns:1fr 1fr 110px auto;gap:6px;margin:6px 0}.tf input,.tf select{font:inherit;font-size:12.5px;background:var(--card2);color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:6px 8px;min-width:0}
@media(max-width:600px){.tf{grid-template-columns:1fr}}
.foot{font-size:11px;color:var(--mut);margin-top:8px;display:flex;gap:14px;flex-wrap:wrap}
</style></head>
<body>
<div class="bgfx"><div class="g1"></div><div class="g2"></div><div class="dots"></div><div class="scan"></div></div>
<div class="v1">
 <div class="bar1"><h1>Sales Control <span>V1</span></h1><span class="status grey" id="snap"></span><span class="sp"></span>
  <label class="small muted" for="as">View as</label><select id="as"></select>
  <button class="theme-btn" id="theme" title="Light or dark">☀ / ☾</button></div>
 <div id="app"></div>
 <div class="foot"><span>Reads HubSpot only. Nothing is sent from this page.</span><span>Priority accounts: top 20 per BDM, top 10 per SAM and CSM. Worked = activity logged this week.</span><span>Meeting gaps cover this week and last week.</span></div>
</div>
<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" hidden aria-label="Person detail"></aside>
<script src="data/live.js"></script><script src="data/sample.js"></script><script src="data/initiatives.js"></script>
<script src="app/common.js"></script><script src="app/charts.js"></script><script src="app/engine.js"></script>
<script>
(function(){
const M=window.MCA,E=window.ENG,CH=window.CH,D=M.D,esc=M.esc,chf=M.chf,fmtD=M.fmtD;
const C=CH.C; const first=n=>n.split(' ')[0]; const sum=a=>a.reduce((x,y)=>x+(y||0),0);
document.getElementById('snap').textContent=(D.isSample?'SAMPLE DATA':'HUBSPOT '+D.generated.slice(0,10))+' · READ ONLY · '+M.W.label;
const REPS=D.reps; let as='sue', sortBy='priority', open=null, tab='accounts';
const col={buying:'var(--gr)',intouch:'#60a5fa',needswork:'var(--rd)'};
const short=s=>s.length>70?s.slice(0,68)+'…':s;
const _S={}; function S(r){ if(_S[r.id]) return _S[r.id]; const s=M.repSummary(r), n=M.cap(r), top=s.pa.slice(0,n);
  const x={r,s,n,top,worked:top.filter(a=>a.workedThisWeek).length,buying:top.filter(a=>a.status==='buying').length,intouch:top.filter(a=>a.status==='intouch').length,needs:top.filter(a=>a.status==='needswork').length,needsCold:top.filter(a=>a.status==='needswork'&&!a.workedThisWeek).length,
   mWk:s.ms.length,noType:s.g.noType.length,noOut:s.g.noOutcome.length,demos:s.g.demos.length,lost:s.lost.length,lostNoReason:s.lostNoReason.length,won:s.won.length};
  x.rag={priority:!top.length?'bad':x.worked/Math.max(1,top.length-x.buying)>=0.5?'ok':x.worked>0?'warn':'bad', meetings:(x.noType+x.noOut)===0?'ok':(x.noType+x.noOut)<=3?'warn':'bad', pipeline:s.past.n===0&&s.stale.n===0?'ok':s.past.n<=5?'warn':'bad'};
  return _S[r.id]=x; }
function nudges(x){ const f=first(x.r.name), out=[];
  if(!x.top.length) out.push({k:'priority',t:f+', there is no priority account list in HubSpot for you yet. Mark your top '+x.n+' as Target Account.'});
  else if(x.needsCold) out.push({k:'priority',t:f+', '+x.needsCold+' of your top '+x.n+' accounts need work and have no activity this week.'});
  if(x.s.past.n>5) out.push({k:'pipeline',t:f+', you have '+x.s.past.n+' deals with a close date in the past ('+chf(x.s.past.amt)+'). Clean up your pipeline.'});
  if(x.s.stale.n>=3) out.push({k:'pipeline',t:f+', '+x.s.stale.n+' deals have had no activity for 30 days.'});
  if(x.noType>=3) out.push({k:'meetings',t:f+', '+x.noType+' meetings have no type. Add the meeting type so we can see demos and new business.'});
  if(x.noOut>=3) out.push({k:'meetings',t:f+', '+x.noOut+' past meetings have no outcome logged.'});
  if(x.lostNoReason) out.push({k:'meetings',t:f+', '+x.lostNoReason+' lost deals have no reason. Add the reason and the competitor.'});
  return out; }
function all(){ return REPS.map(S); }
function rows(){ const a=all(); const k={priority:x=>x.top.length?(x.worked/x.top.length)*1000-x.needsCold:-1e6, meetings:x=>-(x.noType+x.noOut), pipeline:x=>-x.s.past.n}[sortBy]; return a.sort((p,q)=>k(p)-k(q)); }
const seg=(parts,h)=>CH.segbar(parts,{legend:false,height:h||8});

function priCards(list){ const top=list.flatMap(x=>x.top), worked=sum(list.map(x=>x.worked)), N=top.length, buy=top.filter(a=>a.status==='buying').length, it=top.filter(a=>a.status==='intouch').length, nw=top.filter(a=>a.status==='needswork').length;
  const ms=list.flatMap(x=>x.s.ms.concat(x.s.lm)); const typ={}; ms.forEach(m=>{const k=!m.type?'No type':M.isDemo(m)?'Demo':m.type; typ[k]=(typ[k]||0)+1;});
  const tcol={'Discovery':'var(--cy)','Demo':'var(--vi)','Prospecting':'var(--am)','No type':'var(--rd)'}; const types=Object.entries(typ).sort((a,b)=>b[1]-a[1]).map(([k,v])=>({label:k,value:v,color:tcol[k]||'#5d6f8a'}));
  const lost=list.flatMap(x=>x.s.lost), won=list.flatMap(x=>x.s.won); const rs={}; lost.forEach(d=>{const k=(d.lostReason||'no reason').trim(); rs[k]=(rs[k]||0)+1;}); const topR=Object.entries(rs).sort((a,b)=>b[1]-a[1])[0];
  const due=list.flatMap(x=>x.s.dueList); const st={}; due.forEach(d=>{st[d.stage]=(st[d.stage]||0)+(d.amount||0);}); const scol=['var(--gr)','var(--cy)','var(--vi)','var(--am)','#5d6f8a']; const stages=['Negotiation','Quote Sent','Sales Qualified/SQL','Needs Sales Qualification','Deal Created / MQL'].map((k,i)=>({label:k,value:st[k]||0,color:scol[i]}));
  const card=(k,c,inner)=>'<div class="card '+c+(sortBy===k&&as==='sue'?' on':'')+'" data-sort="'+k+'" tabindex="0">'+inner+'</div>';
  return '<div class="pri">'
   +card('priority','','<div class="k"><span>1 · Priority accounts</span><span>top 20 BDM · top 10 SAM/CSM</span></div><div class="big">'+worked+' of '+N+'<small>worked this week</small></div>'+seg([{label:'buying (open deal)',value:buy,color:col.buying},{label:'in touch (30 days)',value:it,color:col.intouch},{label:'needs work',value:nw,color:col.needswork}],10)+'<div class="lg"><span><i style="background:var(--gr)"></i>buying '+buy+'</span><span><i style="background:#60a5fa"></i>in touch '+it+'</span><span><i style="background:var(--rd)"></i>needs work '+nw+'</span></div>')
   +card('meetings','vi','<div class="k"><span>2 · Meetings and outcomes</span><span>this + last week</span></div><div class="big">'+sum(list.map(x=>x.mWk))+'<small>meetings this week</small></div>'+seg(types,10)+'<div class="lg">'+types.map(t=>'<span><i style="background:'+t.color+'"></i>'+esc(t.label)+' '+t.value+'</span>').join('')+'</div><div class="ln"><b class="r">'+sum(list.map(x=>x.noType))+'</b> no type · <b class="r">'+sum(list.map(x=>x.noOut))+'</b> no outcome · lost '+lost.length+' / won '+won.length+' in 30 days'+(topR?' · top loss reason: <b>'+esc(topR[0].slice(0,38))+'</b>':'')+'</div>')
   +card('pipeline','am','<div class="k"><span>3 · Pipeline</span><span>due to close by 31 Dec</span></div><div class="big">'+chf(sum(list.map(x=>x.s.due.amt)))+'<small>'+sum(list.map(x=>x.s.due.n))+' deals due</small></div>'+seg(stages,10)+'<div class="lg">'+stages.filter(s=>s.value).map(s=>'<span><i style="background:'+s.color+'"></i>'+esc(s.label.replace('Needs Sales Qualification','Needs qual.').replace('Deal Created / MQL','MQL'))+'</span>').join('')+'</div><div class="ln"><b class="r">'+sum(list.map(x=>x.s.past.n))+'</b> deals past close date ('+chf(sum(list.map(x=>x.s.past.amt)))+') · <b>'+sum(list.map(x=>x.s.stale.n))+'</b> stale, no activity in 30 days</div>')
   +'</div>'; }

function board(){ const list=rows(); let h=priCards(list);
  const th=(k,l)=>'<th class="'+(sortBy===k?'on':'')+'" data-sort="'+k+'" style="cursor:pointer">'+l+'</th>';
  h+='<div class="main"><div class="card lb"><table><thead><tr><th>Person</th>'+th('priority','1 · Priority accounts')+'<th class="n">Worked</th>'+th('meetings','2 · Meetings wk')+'<th class="n">No type</th><th class="n">No outcome</th><th class="n">Demos</th><th class="n">Lost / won</th>'+th('pipeline','3 · Due by 31 Dec')+'<th class="n">Past date</th><th class="n">Stale</th></tr></thead><tbody>'
   +list.map(x=>'<tr class="p" data-p="'+x.r.id+'"><td><b>'+esc(x.r.name)+'</b> <span class="muted small">'+x.r.team+(x.r.region?' · '+x.r.region:'')+'</span></td>'
     +'<td><span class="dot '+x.rag.priority+'"></span><span class="mini">'+(x.top.length?seg([{label:'buying',value:x.buying,color:col.buying},{label:'in touch',value:x.intouch,color:col.intouch},{label:'needs work',value:x.needs,color:col.needswork}],7):'<span class="small r">no list</span>')+'</span></td>'
     +'<td class="n">'+x.worked+' / '+x.top.length+'</td>'
     +'<td><span class="dot '+x.rag.meetings+'"></span>'+x.mWk+'</td><td class="n'+(x.noType?' r':'')+'">'+x.noType+'</td><td class="n'+(x.noOut?' r':'')+'">'+x.noOut+'</td><td class="n">'+x.demos+'</td><td class="n">'+x.lost+' / '+x.won+'</td>'
     +'<td><span class="dot '+x.rag.pipeline+'"></span>'+chf(x.s.due.amt)+' <span class="muted small">'+x.s.due.n+'</span></td><td class="n'+(x.s.past.n>5?' r':'')+'">'+x.s.past.n+'</td><td class="n">'+x.s.stale.n+'</td></tr>').join('')
   +'</tbody></table></div>';
  const nd=list.map(x=>{const a=nudges(x); const n=a.find(n=>n.k===sortBy)||a[0]; return n&&Object.assign({x},n);}).filter(Boolean);
  h+='<div class="card rd"><h3>Nudges <span class="n">one per person · click a name</span></h3><ul class="list nud">'+nd.slice(0,9).map(n=>'<li><span class="who" data-p="'+n.x.r.id+'">'+esc(first(n.x.r.name))+'</span> '+esc(n.t.slice(n.t.indexOf(',')+2))+'</li>').join('')+'</ul></div></div>';
  return h; }

function personView(id){ const x=S(REPS.find(r=>r.id===id)), s=x.s, f=first(x.r.name);
  const tabs=[['accounts','1 · Priority accounts'],['meetings','2 · Meetings'],['pipeline','3 · Pipeline'],['tasks','Nudges and tasks']];
  let h='<div class="three"><div class="tile"><div class="l">Priority worked</div><div class="v">'+x.worked+' / '+x.top.length+'</div><div class="s">'+x.needs+' need work</div></div><div class="tile"><div class="l">Meeting gaps</div><div class="v'+(x.noType+x.noOut?' r':'')+'">'+(x.noType+x.noOut)+'</div><div class="s">'+x.noType+' no type · '+x.noOut+' no outcome</div></div><div class="tile"><div class="l">Past close date</div><div class="v'+(s.past.n>5?' r':'')+'">'+s.past.n+'</div><div class="s">'+chf(s.past.amt)+' · '+s.stale.n+' stale</div></div></div>';
  h+='<div class="tabs" role="tablist">'+tabs.map(t=>'<button role="tab" data-tab="'+t[0]+'" class="'+(tab===t[0]?'on':'')+'">'+t[1]+'</button>').join('')+'</div><div class="db">';
  if(tab==='accounts'){ h+=x.top.length?'<table><thead><tr><th>Account</th><th>Status</th><th>This week</th><th>Last activity</th><th>Open deals</th><th>List</th></tr></thead><tbody>'+x.top.map(a=>'<tr><td><b>'+esc(a.name)+'</b><div class="muted small">'+esc(a.country||'')+'</div></td><td><span class="chip '+(a.status==='buying'?'ok':a.status==='intouch'?'cy':'bad')+'">'+(a.status==='buying'?'buying':a.status==='intouch'?'in touch':'needs work')+'</span></td><td>'+(a.workedThisWeek?'<span class="ok">worked</span>':'<span class="muted">not yet</span>')+'</td><td>'+(a.lastActivity?fmtD(a.lastActivity):'<span class="r">never</span>')+'</td><td>'+(a.openDeals||0)+'</td><td class="small muted">'+esc((a.list||'Target Account').replace('Strategic Accounts - ',''))+'</td></tr>').join('')+'</tbody></table>'+(s.pa.length>x.n?'<p class="small muted">'+(s.pa.length-x.n)+' more accounts are flagged in HubSpot. V1 shows the top '+x.n+'.</p>':''):'<p class="r">No priority accounts in HubSpot for '+esc(f)+' yet. Ask '+esc(f)+' to mark the top '+x.n+' as Target Account.</p>'; }
  if(tab==='meetings'){ const ms=s.lm.concat(s.ms).slice().reverse();
    h+=!ms.length?'<p class="muted small">No meetings logged in HubSpot this week or last week.</p>':'<table><thead><tr><th>Date</th><th>Company</th><th>Type</th><th>Outcome</th><th>Recording</th></tr></thead><tbody>'+ms.map(m=>{const past=m.start.slice(0,10)<=M.today; return '<tr><td>'+fmtD(m.start)+'</td><td>'+esc(m.company||m.title||'')+'</td><td>'+(m.type?esc(m.type):'<span class="chip bad">no type</span>')+'</td><td>'+(m.outcome&&m.outcome!=='SCHEDULED'?esc(m.outcome.toLowerCase()):past?'<span class="chip bad">no outcome</span>':'<span class="muted">upcoming</span>')+'</td><td>'+(m.recording?'<span class="ok">yes</span>':past?'<span class="muted">not in HubSpot</span>':'')+'</td></tr>';}).join('')+'</tbody></table>';
    h+='<h4>Lost in the last 30 days · '+s.lost.length+'</h4>'+(s.lost.length?'<table><tbody>'+s.lost.map(d=>'<tr><td>'+esc(short(d.name))+'</td><td>'+chf(d.amount)+'</td><td>'+(d.lostReason?esc(d.lostReason):'<span class="chip bad">no reason</span>')+'</td><td class="muted">'+esc(d.competitor||'')+'</td></tr>').join('')+'</tbody></table>':'<p class="muted small">None.</p>');
    h+='<h4>Won in the last 30 days · '+s.won.length+'</h4>'+(s.won.length?'<table><tbody>'+s.won.slice(0,12).map(d=>'<tr><td>'+esc(short(d.name))+'</td><td>'+chf(d.amount)+'</td><td>'+fmtD(d.close)+'</td></tr>').join('')+'</tbody></table>':'<p class="muted small">None.</p>'); }
  if(tab==='pipeline'){ const tb=(l,list,why)=>'<h4>'+l+'</h4>'+(list.length?'<table><thead><tr><th>Deal</th><th>Stage</th><th>Amount</th><th>Close date</th><th>Last activity</th></tr></thead><tbody>'+list.map(d=>'<tr><td>'+esc(short(d.name))+'</td><td class="small">'+esc(d.stage)+'</td><td>'+chf(d.amount)+'</td><td'+(why==='past'?' class="r"':'')+'>'+fmtD(d.close)+'</td><td'+(why==='stale'?' class="r"':'')+'>'+(d.lastActivity?fmtD(d.lastActivity):'none')+'</td></tr>').join('')+'</tbody></table>':'<p class="muted small">None.</p>');
    h+=tb('Close date in the past · '+s.past.n+(s.pastList.length<s.past.n?' (largest '+s.pastList.length+' shown)':''),s.pastList,'past')+tb('Stale, no activity in 30 days · '+s.stale.n,s.staleList,'stale')+tb('Due to close by 31 Dec · '+s.due.n+(s.dueList.length<s.due.n?' (largest '+s.dueList.length+' shown)':''),s.dueList.slice().sort((a,b)=>a.close<b.close?-1:1),''); }
  if(tab==='tasks'){ const nd=nudges(x); const T=E.listFor(s).list.filter(t=>t.setBy==='Sue (V1)');
    h+='<h4>Nudges from HubSpot</h4>'+(nd.length?'<ul class="list">'+nd.map((n,i)=>'<li><span class="t">'+esc(n.t)+'</span>'+(as==='sue'?'<button class="btn ghost" data-mk="'+i+'">Make it a task</button>':'')+'</li>').join('')+'</ul>':'<p class="ok small">Nothing flagged. Good week.</p>');
    h+='<h4>Tasks from Sue · '+T.length+'</h4>'+(T.length?'<table><thead><tr><th>Task</th><th>Due</th><th>HubSpot check</th><th></th></tr></thead><tbody>'+T.map(t=>'<tr><td>'+(t.account?'<b>'+esc(t.account)+'</b> · ':'')+esc(t.action)+'</td><td>'+esc(t.due||'')+'</td><td>'+(t.state==='done'?'<span class="chip ok">confirmed</span> ':'<span class="chip na">open</span> ')+'<span class="small muted">'+esc(t.ev.text)+'</span></td><td>'+(as==='sue'?'<button class="btn ghost" data-del="'+t.id+'" aria-label="Delete task">✕</button>':'')+'</td></tr>').join('')+'</tbody></table>':'<p class="muted small">No tasks yet. Visibility first: add a task only when something needs action.</p>');
    if(as==='sue'){ h+='<h4>Add a task for '+esc(f)+'</h4><div class="tf"><select id="t-acc"><option value="">No specific account</option>'+x.top.map(a=>'<option>'+esc(a.name)+'</option>').join('')+'</select><input id="t-act" placeholder="What should '+esc(f)+' do?"><select id="t-due">'+['Mon','Tue','Wed','Thu','Fri'].map(d=>'<option'+(d==='Fri'?' selected':'')+'>'+d+'</option>').join('')+'</select><button class="btn" id="t-add">Add</button></div><p class="small muted">If you pick an account, HubSpot confirms it when activity is logged on it this week.</p>';
      const msg='Hi '+f+', quick check on this week:\n'+(nd.length?nd.map(n=>'• '+n.t.slice(n.t.indexOf(',')+2)).join('\n'):'• Nothing flagged, thanks!')+(T.filter(t=>t.state!=='done').length?'\nOpen tasks:\n'+T.filter(t=>t.state!=='done').map(t=>'• '+(t.account?t.account+': ':'')+t.action).join('\n'):'')+'\nCan you update me by Friday? Thanks, Sue';
      h+='<h4>Ask '+esc(f)+' for an update in Teams</h4><textarea class="ask" id="ask">'+esc(msg)+'</textarea><div style="display:flex;gap:8px;align-items:center;margin-top:6px"><button class="btn" id="copy">Copy message</button><span class="small muted" id="copied">Not sent. Paste it in Teams yourself.</span></div>'; } }
  return h+'</div>'; }

function repPage(id){ const x=S(REPS.find(r=>r.id===id)); return '<h2 style="margin:4px 0 0">'+esc(x.r.name)+' <span class="muted small">'+x.r.team+(x.r.region?' · '+x.r.region:'')+' · your week</span></h2>'+personView(id); }
const app=document.getElementById('app'), dr=document.getElementById('drawer'), scrim=document.getElementById('scrim');
function openP(id){ open=id; const x=S(REPS.find(r=>r.id===id)); dr.innerHTML='<div class="dh"><h2>'+esc(x.r.name)+'</h2><span class="muted small">'+x.r.team+(x.r.region?' · '+x.r.region:'')+'</span><span class="sp"></span><button class="btn ghost" id="close">Close</button></div>'+personView(id); dr.hidden=false; scrim.hidden=false; bindDrawer(dr); dr.querySelectorAll('svg').forEach(CH.hover); }
function closeP(){ open=null; dr.hidden=true; scrim.hidden=true; }
function bindDrawer(root){ root.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab; refresh();});
  const cl=root.querySelector('#close'); if(cl) cl.onclick=closeP;
  const id=as==='sue'?open:as; const x=id&&S(REPS.find(r=>r.id===id));
  root.querySelectorAll('[data-mk]').forEach(b=>b.onclick=()=>{const n=nudges(x)[+b.dataset.mk]; E.addTask({rep:id,account:'',action:n.t.slice(n.t.indexOf(',')+2),due:'Fri',ws:n.k==='meetings'?'hygiene':'other',setBy:'Sue (V1)'}); refresh();});
  root.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{E.deleteTask(b.dataset.del); refresh();});
  const add=root.querySelector('#t-add'); if(add) add.onclick=()=>{const acc=root.querySelector('#t-acc').value, act=root.querySelector('#t-act').value.trim(); if(!act) {root.querySelector('#t-act').focus(); return;} E.addTask({rep:id,account:acc,action:act,due:root.querySelector('#t-due').value,ws:acc?'top20':'other',setBy:'Sue (V1)'}); refresh();};
  const cp=root.querySelector('#copy'); if(cp) cp.onclick=()=>{const ta=root.querySelector('#ask'); const done=()=>{root.querySelector('#copied').textContent='Copied. Paste it in Teams.';}; try{navigator.clipboard.writeText(ta.value).then(done,()=>{ta.select();});}catch(e){ta.select();}};
}
function refresh(){ if(as==='sue'){ app.innerHTML=board(); if(open) openP(open); } else { app.innerHTML=repPage(as); bindDrawer(app); closeP(); }
  app.querySelectorAll('svg').forEach(CH.hover);
  app.querySelectorAll('[data-sort]').forEach(e=>{e.onclick=()=>{sortBy=e.dataset.sort; refresh();}; e.onkeydown=ev=>{if(ev.key==='Enter'){sortBy=e.dataset.sort; refresh();}};});
  app.querySelectorAll('[data-p]').forEach(e=>e.onclick=()=>{tab='accounts'; openP(e.dataset.p);}); }
scrim.onclick=closeP; document.addEventListener('keydown',e=>{if(e.key==='Escape') closeP();});
const sel=document.getElementById('as'); sel.innerHTML='<option value="sue">Sue · whole team</option>'+['BDM','SAM','CSM'].map(t=>'<optgroup label="'+t+'s">'+REPS.filter(r=>r.team===t).map(r=>'<option value="'+r.id+'">'+esc(r.name)+'</option>').join('')+'</optgroup>').join('');
sel.onchange=()=>{as=sel.value; tab='accounts'; refresh();};
document.getElementById('theme').onclick=()=>{const t=document.documentElement.dataset.theme==='dark'?'light':'dark'; document.documentElement.dataset.theme=t; try{localStorage.setItem('mca.theme',t)}catch(e){} CH.setTheme(t); refresh();};
refresh();
})();
</script></body></html>
