<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sales Control</title>
<script>(function(){var t;try{t=localStorage.getItem("mca.theme")}catch(e){}document.documentElement.dataset.theme=t||"dark";})();</script>
<link rel="stylesheet" href="app/future.css">
<style>.home{max-width:980px;margin:0 auto;padding:48px max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px))}.hh{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}.hh h1{margin:0;font-size:34px}
.tiles4{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}@media(max-width:600px){.tiles4{grid-template-columns:1fr}}
.go{display:flex;flex-direction:column;gap:18px;padding:26px 24px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);text-decoration:none;transition:transform .15s,box-shadow .15s}.go:hover,.go:focus-visible{transform:translateY(-2px);box-shadow:0 10px 30px -12px var(--c)}
.go .k{font-family:"JetBrains Mono",Menlo,monospace;font-size:12px;color:var(--c)}.go b{font-size:24px;letter-spacing:-.01em}
.go.cy{--c:var(--cy);border-color:rgba(34,229,255,.35)}.go.gr{--c:var(--gr);border-color:rgba(61,255,162,.35)}.go.vi{--c:var(--vi);border-color:rgba(139,92,246,.4)}.go.am{--c:var(--am);border-color:rgba(245,158,11,.4)}</style></head>
<body>
<div class="bgfx"><div class="g1"></div><div class="g2"></div><div class="dots"></div><div class="scan"></div></div>
<div class="page"><main class="home">
<div class="hh"><h1>Sales <span class="g">Control</span></h1><button class="theme-btn" id="theme" title="Light or dark">☀ / ☾</button></div>
<div class="tiles4">
 <a class="go cy" href="dashboard.html"><span class="k">01</span><b>Dashboard</b></a>
 <a class="go gr" href="v1.html"><span class="k">02</span><b>Priorities</b></a>
 <a class="go vi" href="v2.html"><span class="k">03</span><b>Full platform</b></a>
 <a class="go am" href="agent-terminal.html"><span class="k">04</span><b>Agent</b></a>
</div>
</main></div>
<script>document.getElementById("theme").onclick=function(){var t=document.documentElement.dataset.theme==="dark"?"light":"dark";document.documentElement.dataset.theme=t;try{localStorage.setItem("mca.theme",t)}catch(e){}};</script>
</body></html>
